name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # اگر نام شاخه اصلی شما master است، این را به master تغییر دهید

# تنظیم دسترسی‌های لازم برای گیت‌هاب
permissions:
  contents: read
  pages: write
  id-token: write

# جلوگیری از اجرای همزمان چند دیپلوی
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20' # نسخه نود جی‌اس (معمولاً 18 یا 20 مناسب است)
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci # یا npm install
      
      - name: Build
        run: npm run build
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ⚠️ نکته بسیار مهم: اگر از Vite استفاده می‌کنید './dist' و اگر از Create React App استفاده می‌کنید './build' را بنویسید.
          path: ./dist 

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4